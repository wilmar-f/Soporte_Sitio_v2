services:
  - type: web
    name: diagnostico-web
    env: node
    region: oregon
    plan: starter
    buildCommand: cd backend && npm install
    startCommand: node backend/server.js
    disk:
      name: diagnostico-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: ONEDRIVE_CLIENT_ID
        sync: false
      - key: ONEDRIVE_CLIENT_SECRET
        sync: false
      - key: ONEDRIVE_TENANT
        sync: false
      - key: ONEDRIVE_FOLDER_URL
        sync: false
      - key: ONEDRIVE_REFRESH_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /
